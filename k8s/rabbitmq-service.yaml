apiVersion: v1
kind: Service
metadata:
  name: vprofile-rabbitmq
  namespace: v-profile
spec:
  type: ClusterIP
  selector:
    app: vprofile-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
    - name: management
      port: 15672
      targetPort: 15672
      protocol: TCP
