apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-elasticsearch
  namespace: v-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vprofile-elasticsearch
  template:
    metadata:
      labels:
        app: vprofile-elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: xpack.security.enabled
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 1Gi
