apiVersion: apps/v1
kind: Deployment

metadata:
  name: vprofile-app
  namespace: v-profile
  labels:
    app: vprofile-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: vprofile-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: vprofile-app

    spec:
      containers:
        - name: vprofile-app
          image: bhargavram2309/vprofile:latest}
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
